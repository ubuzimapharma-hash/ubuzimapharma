<!doctype html>
<html lang="rn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#064c41">
  <title>Ikiganiro na muganga | UBUZIMA PHARMA</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="config.js"></script>
  <script defer src="consultation.js?v=20261114-call-autostart"></script>
</head>
<body class="consultation-call-page" data-consultation-call>
  <main class="consultation-call-shell">
    <a class="consultation-call-brand" href="index.html" aria-label="UBUZIMA PHARMA home">✚ UBUZIMA <b>PHARMA</b></a>
    <section class="consultation-call-panel">
      <div class="consultation-call-heading"><span class="section-kicker">IKIGANIRO CIBANGA NA MUGANGA</span><h1>Ikiganiro ca videwo</h1><p id="consultationCallStatus" role="status" aria-live="polite">Turiko turagenzura gahunda yawe...</p></div>
      <div class="consultation-video-grid">
        <figure class="consultation-video-tile"><video id="consultationRemoteVideo" autoplay playsinline></video><figcaption>Umuntu muganira</figcaption></figure>
        <figure class="consultation-video-tile consultation-local-tile"><video id="consultationLocalVideo" autoplay muted playsinline></video><figcaption>Wewe</figcaption></figure>
      </div>
      <div class="consultation-call-controls">
        <button class="btn btn-primary" id="consultationJoin" type="button" disabled>Injira mu kiganiro</button>
        <button class="btn btn-outline" id="consultationMute" type="button" disabled>Funga ijwi</button>
        <button class="btn btn-outline" id="consultationCamera" type="button" disabled>Funga kamera</button>
        <button class="btn btn-danger" id="consultationHangup" type="button" disabled>Sozera ikiganiro</button>
      </div>
      <p class="consultation-translation-note">Ihamagarwa rirakoresha ijwi na videwo. Guhindura Kirundi, Icongereza n'Igifaransa mu majwi ntibiraboneka. Mukoreshe uwuhindura mu gihe muganira ku buvuzi.</p>
      <a class="consultation-return-link" id="consultationReturn" href="/patient/">Subira kuri konti</a>
    </section>
  </main>
</body>
</html>
