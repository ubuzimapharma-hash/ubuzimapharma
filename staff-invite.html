<!DOCTYPE html>
<html lang="rn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emeza ubutumire | UBUZIMA PHARMA</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="manager-section"><div class="container"><section class="manager-panel">
    <h1>Emeza ubutumire bw'akazi</h1>
    <p>Shiraho ijambobanga ry'ibanga kugira ukoreshe konti yawe y'umukozi.</p>
    <form id="staffInviteForm">
      <label for="invitePassword">Ijambobanga (inyuguti 12 canke zirenga)</label>
      <input id="invitePassword" name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
      <button class="btn btn-primary" type="submit">Emeza ubutumire</button>
    </form>
    <p class="manager-status" id="staffInviteStatus" role="status" aria-live="polite" hidden></p>
    <a class="text-link" id="staffInvitePortalLink" href="/pharmacist/" hidden>Injira ku rubuga rw'akazi</a>
  </section></div></main>
</body>
</html>
