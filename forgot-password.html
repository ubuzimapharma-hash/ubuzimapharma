<!DOCTYPE html>
<html lang="rn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#064c41">
  <title>Wibagiye ijambobanga | UBUZIMA PHARMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="admin-app password-recovery-page">
  <main class="password-recovery-main">
    <div class="container password-recovery-container">
      <section class="manager-panel admin-login-card">
        <div class="admin-login-mark" aria-hidden="true">✚</div>
        <span class="section-kicker">UBUZIMA PHARMA</span>
        <h1>Wibagiye <span>ijambobanga?</span></h1>
        <p>Shiramwo email ya konti yawe. Nimba tuyironse, turungika link yo guhindura ijambobanga imara isaha imwe.</p>
        <form id="forgotPasswordForm">
          <label for="recoveryAccountType">Ubwoko bwa konti</label>
          <select id="recoveryAccountType" name="account_type" required>
            <option value="staff">Umukozi wa farumasi</option>
            <option value="patient">Umurwayi</option>
          </select>
          <label for="recoveryEmail">Email ya konti yawe</label>
          <input id="recoveryEmail" name="email" type="email" maxlength="254" autocomplete="email" required>
          <button class="btn btn-primary" type="submit">Rungika link yo guhindura ijambobanga</button>
        </form>
        <p class="manager-status" id="forgotPasswordStatus" role="status" aria-live="polite" hidden></p>
        <a class="text-link" href="/admin/">Subira ku kwinjira</a>
      </section>
    </div>
  </main>
</body>
</html>
