<!DOCTYPE html>
<html lang="rn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#064c41">
  <title>Shiraho ijambobanga rishasha | UBUZIMA PHARMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="admin-app password-recovery-page">
  <main class="password-recovery-main">
    <div class="container password-recovery-container">
      <section class="manager-panel admin-login-card">
        <div class="admin-login-mark" aria-hidden="true">✚</div>
        <span class="section-kicker">UBUZIMA PHARMA</span>
        <h1>Shiraho ijambobanga <span>rishasha.</span></h1>
        <p>Ijambobanga rishasha ritegerezwa kugira inyuguti nibura 12.</p>
        <form id="passwordResetForm">
          <label for="resetPassword">Ijambobanga rishasha</label>
          <input id="resetPassword" name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
          <label for="resetPasswordConfirmation">Subiramwo ijambobanga rishasha</label>
          <input id="resetPasswordConfirmation" name="password_confirmation" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
          <button class="btn btn-primary" type="submit">Bika ijambobanga rishasha</button>
        </form>
        <p class="manager-status" id="passwordResetStatus" role="status" aria-live="polite" hidden></p>
        <a class="text-link" id="passwordResetLoginLink" href="/admin/" hidden>Injira ukoresheje ijambobanga rishasha</a>
        <nav class="password-reset-staff-links" id="passwordResetStaffLinks" aria-label="Hitamwo urubuga rw'akazi" hidden><a href="/admin/">Ubuyobozi</a><a href="/pharmacist/">Abafarumasiye</a><a href="/doctor/">Abaganga</a></nav>
      </section>
    </div>
  </main>
</body>
</html>
